# KHARVOX static controller-hand assets and wrist calibration (version 3).
# Paths are relative to KharvoxLayer.dll. KHARVOX selects the default scene and
# accepts the revised, already-baked static mesh directly. Rigged fallback
# assets can still be baked once on the CPU; no per-frame skinning is performed.
version=3
left_fist=assets/3D/DOOM_LEFT_HAND_FIST.glb
right_fist=assets/3D/DOOM_RIGHT_HAND_FIST.glb
left_gun=assets/3D/DOOM_LEFT_HAND_GUN.glb
right_gun=assets/3D/DOOM_RIGHT_HAND_GUN.glb

# Both revised left-hand models are native L_Pose exports and must not be
# mirrored. Mirroring remains pose-specific so future exports can be exchanged
# independently without modifying the source assets.
left_fist_mirror_x=0
right_fist_mirror_x=0
left_gun_mirror_x=0
right_gun_mirror_x=0

# OpenXR grip-space fallback in metres / Euler degrees (XYZ), then uniform
# scale. Accepted global and per-weapon wrists are loaded from
# hand_models_calibration_default.cfg; local *_saved.cfg overrides come last.
left_position=0.000 0.000 0.000
left_rotation=0.000 180.000 0.000
left_scale=0.2464
right_position=0.000 0.000 0.000
right_rotation=0.000 180.000 0.000
right_scale=0.2464
