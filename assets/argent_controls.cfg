# Live reload once per second. Offsets are metres; rotations pitch/yaw/roll degrees.
# Profiles are explicitly selected until Eternal weapon identity is verified.
dominant right
left_hand_swap buttons
movement head
# turn snap 45 enables a discrete turn with native body catch-up.
turn smooth
profile default
capture_support 0
show_hands 1
laser_sight 0
hands_jump 1
calibration_mode off
hand left 0 0 0 0 0 0
hand right 0 0 0 0 0 0
# weapon name offsetXYZ pitch yaw roll supportXYZ radius weight twoHand
weapon default 0 0 0 0 0 0 0 0 -0.30 0.14 1 1

# Automatic presentation; F11 is only used when automatic_presentation is 0.
automatic_presentation 1
cinematics_quad 1
cinematics_3d 0
sync_immersive 1
movement_immersive 1
controller_layout argent
shoulder_chainsaw 1
virtual_gunstock 1
two_hand_enabled 1
bhaptics_enabled 0
psvr2_adaptive_triggers 0

# KHARVOX gesture thresholds; handedness selects weapon/trigger/shoulder.
smooth_turn_speed 230
physical_glory_kill 1
physical_glory_kill_speed 2.8
physical_glory_kill_hands both
crouch_enabled 0

# Weapon pivot: forward / left / up, metres; -0.15 is the calibrated zero shown in the launcher.
weapon_pivot -0.15 0 0
